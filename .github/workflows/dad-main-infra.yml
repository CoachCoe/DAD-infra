name: DAD-Main Infra (CDK)

# Infrastructure pipeline for the apps/dad-main CDK app (network, data, ECS
# cluster, services, maintenance, edge, observability, SES, pipeline IAM).
# Extracted from DAD-Main/infra/.github/workflows/infra.yml: after the extraction
# the CDK app lives here in the monorepo, so the infra pipeline runs from here.
# The application rollout (ECR build/push + `aws ecs update-service`) stays
# repo-local in DAD-Main's deploy.yml — it is not CDK. Deploys are path-filtered so
# a change to this app or the shared packages deploys only this app, never the
# other tenants in the monorepo.
#
# Flow (models DAD-Main/infra/.github/workflows/infra.yml):
#   - every PR (unfiltered, so the required `synth` check always reports)
#                              -> offline `cdk synth` of BOTH envs (no AWS creds).
#                                 This is the real PR signal.
#   - push to dev              -> `cdk deploy -c env=staging`  (sandbox 853377042897).
#   - push to main             -> `cdk deploy -c env=production` (216833405626),
#                                 gated by the `production` GitHub Environment
#                                 (configure a manual-approval protection rule there).
#
# Auth is GitHub OIDC assuming the pipeline-iam deploy role (no static keys). The
# role ARN is read from a GitHub Environment variable (vars.INFRA_DEPLOY_ROLE_ARN)
# so account ids are not hardcoded here. Credentialed jobs are gated on that
# variable being set: before the account is bootstrapped the variable is unset, so
# the deploy jobs are skipped (green) and the offline synth stays the only signal.
# Region is us-east-2.

on:
  # No `paths:` filter on pull_request: the `synth` job is a required status check, and
  # a required check that never runs (because a PR touched only docs, say) blocks the
  # merge forever. Deploys below stay path-filtered.
  pull_request:
  push:
    branches: [dev, main]
    paths:
      - "apps/dad-main/**"
      - "packages/**"
      - ".github/workflows/dad-main-infra.yml"
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

# OIDC needs id-token: write; the rest is read-only.
permissions:
  contents: read
  id-token: write

concurrency:
  group: dad-main-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  NODE_VERSION: "22"

jobs:
  # PRs: always validate the IaC offline with `cdk synth` of both envs (no AWS
  # credentials needed). This job has no `if` gate on credentials/role vars; it is
  # the unconditional PR signal.
  synth:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # Unit tests for every workspace, including the SMTP rotation function's Python
      # tests (run by jest). Part of the required `synth` check.
      # Each suite synthesizes the whole CDK app, which is memory-heavy: cap the workers
      # and recycle any that grow past 1 GB (one ran out of memory with the defaults).
      - run: npx jest --ci --maxWorkers=2 --workerIdleMemoryLimit=1024MB
      # Offline validation: synth both environments with dummy account/region.
      # This is the real PR signal and needs no AWS credentials.
      - name: cdk synth (staging + production, offline)
        working-directory: apps/dad-main
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          npx cdk synth -c env=staging >/dev/null
          npx cdk synth -c env=production >/dev/null

  # Merge to dev -> staging deploy. Skipped (green) until the account is
  # bootstrapped and INFRA_DEPLOY_ROLE_ARN is set (matches DAD-Main's pattern).
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.INFRA_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy (staging)
        working-directory: apps/dad-main
        run: npx cdk deploy -c env=staging --all --require-approval never

  # Release tag or merge to main -> production deploy, gated by the `production`
  # GitHub Environment (manual-approval protection rule is configured on that
  # environment in repo settings, not in YAML) and the deploy-role var.
  deploy-production:
    if: >-
      vars.INFRA_DEPLOY_ROLE_ARN != '' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy (production)
        working-directory: apps/dad-main
        run: npx cdk deploy -c env=production --all --require-approval never

  # On-demand deploy to a chosen environment, gated on the deploy-role var.
  deploy-dispatch:
    if: github.event_name == 'workflow_dispatch' && vars.INFRA_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy (${{ inputs.env }})
        working-directory: apps/dad-main
        run: npx cdk deploy -c env=${{ inputs.env }} --all --require-approval never
