name: ATM Infra (CDK)
# Checks for the apps/atm CDK app (the DAD-Quality runner on AWS: CodeBuild, S3
# evidence, DynamoDB, scheduled trigger). It is built and tested on every PR but is
# deliberately NOT deployed, and this workflow has no deploy jobs.
#
# Why: DAD-Main's ATM acceptance gate (atm.yml) and its Worker ledger are the single
# source of truth for findings, and that ledger accepts only receipts bound to a GitHub
# Actions run. Deploying this runner on its own would create a second findings store.
# It is held until there is a need GitHub-hosted runs cannot meet (e.g. runs longer than
# the gate's job limit); it would then publish through a GitHub job so the ledger's
# trust model is unchanged. See docs/design/aws-infra-design.md §6.5 and DAD-Docs ADR 0006.
#
# Every PR (unfiltered, so the required `synth` check always reports) -> unit tests and an
# offline `cdk synth` of both environments, with no AWS credentials.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: atm-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  NODE_VERSION: "22"

jobs:
  synth:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # Unit tests for every workspace, including the SMTP rotation function's Python
      # tests (run by jest). Part of the required `synth` check.
      # Each suite synthesizes the whole CDK app, which is memory-heavy: cap the workers
      # and recycle any that grow past 1 GB (one ran out of memory with the defaults).
      - run: npx jest --ci --maxWorkers=2 --workerIdleMemoryLimit=1024MB
      # Offline validation: synth both environments with dummy account/region.
      # This is the real PR signal and needs no AWS credentials.
      - name: cdk synth (staging + production, offline)
        working-directory: apps/atm
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          npx cdk synth -c env=staging >/dev/null
          npx cdk synth -c env=production >/dev/null
